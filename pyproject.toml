[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-knowledge-agent"
version = "0.2.0"
description = "An offline, citation-first enterprise knowledge assistant prototype."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "magicyao2028-pixel" }]
dependencies = []

[project.scripts]
knowledge-agent = "enterprise_knowledge_agent.cli:main"
knowledge-agent-eval = "enterprise_knowledge_agent.evaluation_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
